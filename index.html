const lessons=[
{title:'Was ist ein IT-System?',minutes:12,html:`<p>Ein <strong>IT-System</strong> besteht aus zusammenwirkenden Komponenten: Hardware, Software, Netzwerk, Daten und IT-Dienstleistungen. Gemeinsam erfüllen sie eine geschäftliche Aufgabe.</p><p><strong>Praxisfall:</strong> Eine Kanzlei möchte zehn Arbeitsplätze modernisieren. Dazu gehören nicht nur PCs, sondern auch Betriebssysteme, gemeinsame Dokumentenablage, Netzwerkanbindung, Zugriffsschutz und Support.</p><table><tr><th>Bestandteil</th><th>Beispiel</th></tr><tr><td>Hardware</td><td>PC, Drucker, Switch</td></tr><tr><td>Software</td><td>Windows, Buchhaltungsprogramm</td></tr><tr><td>Netzwerk</td><td>LAN, WLAN</td></tr><tr><td>Daten</td><td>Rechnungen, Dokumente</td></tr><tr><td>IT-Service</td><td>Installation, Wartung</td></tr></table><p class="note"><strong>Merke:</strong> Ein IT-System ist mehr als ein einzelner Computer.</p>`},
{title:'Hardware und Software',minutes:12,html:`<p><strong>Hardware</strong> sind die physischen Komponenten eines Computers oder Netzwerks, z. B. CPU, Arbeitsspeicher (RAM), SSD, Switch und Router.</p><p><strong>Systemsoftware</strong> stellt grundlegende Funktionen bereit, z. B. Windows oder Linux. <strong>Anwendungssoftware</strong> unterstützt konkrete Aufgaben, z. B. Tabellenkalkulation oder Buchhaltung.</p><table><tr><th>Begriff</th><th>Funktion</th></tr><tr><td>CPU</td><td>Verarbeitet Befehle</td></tr><tr><td>RAM</td><td>Temporärer Arbeitsspeicher</td></tr><tr><td>SSD</td><td>Dauerhafter Datenspeicher</td></tr><tr><td>Switch</td><td>Verbindet Geräte in einem LAN</td></tr><tr><td>Router</td><td>Verbindet verschiedene IP-Netze</td></tr></table><p class="note">Eine SSD ist Hardware. Die darauf installierte Buchhaltungssoftware ist Anwendungssoftware.</p>`},
{title:'Kundenbedarf ermitteln',minutes:15,html:`<p>Ein Kunde sagt: „Unsere Rechner sind zu langsam. Wir brauchen zehn neue PCs.“ Ein guter IT-Kaufmann bestellt nicht sofort, sondern klärt zunächst die Ursache und das Ziel.</p><ol><li><strong>Ist-Situation:</strong> Welche Geräte und Systeme werden genutzt?</li><li><strong>Problem:</strong> Was ist langsam und wann?</li><li><strong>Soll-Situation:</strong> Was muss künftig besser funktionieren?</li><li><strong>Rahmenbedingungen:</strong> Budget, Zeit, Sicherheit, Kompatibilität?</li><li><strong>Lösung:</strong> Alternativen vergleichen und begründen.</li></ol><p><strong>Beispielfragen:</strong> Wie viele Mitarbeiter arbeiten gleichzeitig? Welche Software ist betroffen? Wann treten die Verzögerungen auf? Gibt es einen maximalen Kostenrahmen?</p><p class="note">Ziel ist eine bedarfsgerechte Lösung – nicht automatisch der Verkauf der teuersten Hardware.</p>`},
{title:'Anforderungen unterscheiden',minutes:13,html:`<p><strong>Funktionale Anforderungen</strong> beschreiben, <em>was</em> das System leisten soll: Dokumente speichern, Rechnungen als PDF erzeugen, Benutzerrechte vergeben.</p><p><strong>Nichtfunktionale Anforderungen</strong> beschreiben Qualitätsmerkmale oder Bedingungen: Verfügbarkeit, Reaktionszeit, Sicherheit, Bedienbarkeit.</p><p><strong>Projektvorgaben</strong> wie Budget und Einführungstermin werden oft separat dokumentiert. Je nach Unterrichtsmodell können sie auch unter Rahmenbedingungen oder nichtfunktionalen Anforderungen eingeordnet werden.</p><table><tr><th>Aussage</th><th>Einordnung</th></tr><tr><td>PDF-Rechnungen erzeugen</td><td>Funktional</td></tr><tr><td>99,9 % Verfügbarkeit</td><td>Nichtfunktional</td></tr><tr><td>Maximal 8.000 €</td><td>Budgetvorgabe</td></tr><tr><td>Einführung in vier Wochen</td><td>Terminvorgabe</td></tr></table>`},
{title:'Lastenheft und Pflichtenheft',minutes:15,html:`<p><strong>Lastenheft:</strong> Der Auftraggeber beschreibt Anforderungen, Ziele und Rahmenbedingungen: <em>Was wird benötigt und wozu?</em></p><p><strong>Pflichtenheft:</strong> Der Auftragnehmer konkretisiert die Umsetzung: <em>Wie werden die Anforderungen erfüllt?</em></p><p><strong>Praxisfall:</strong> Ein Unternehmen benötigt einen sicheren gemeinsamen Dokumentenzugriff (Lastenheft). Der Anbieter plant eine zentrale Ablage mit Rollenberechtigungen, Datensicherung und Abnahmetests (Pflichtenheft).</p><p class="note"><strong>Merksatz:</strong> Lastenheft = WAS? Pflichtenheft = WIE?</p><p>In echten Projekten können agile Backlogs oder andere Dokumentationsformen diese Aufgaben übernehmen.</p>`}
];

const modules=[{id:1,title:"IT-Grundlagen",lessons,questions,cards},...[{"id":2,"title":"Netzwerke & IP","lessons":[{"title":"Netzwerkgeräte","minutes":12,"html":"<p>Ein Switch verbindet Geräte im LAN anhand von MAC-Adressen. Ein Router verbindet unterschiedliche IP-Netze und leitet Pakete anhand der Routingtabelle weiter.</p><p><strong>Praxisbeispiel:</strong> Büro-PCs am Switch; Router stellt Verbindung zum Internet her.</p><p class=\"note\"><strong>Merksatz:</strong> Switch = LAN, Router = Netzübergang.</p>"},{"title":"IPv4 und Subnetze","minutes":12,"html":"<p>IPv4-Adressen bestehen aus 32 Bit. Die Subnetzmaske trennt Netz- und Hostanteil. Bei /24 sind 24 Bit Netzanteil; im üblichen Subnetz bleiben 254 nutzbare Hostadressen.</p><p><strong>Praxisbeispiel:</strong> 192.168.10.25/24 liegt im Netz 192.168.10.0/24.</p><p class=\"note\"><strong>Merksatz:</strong> /24 entspricht 255.255.255.0.</p>"},{"title":"DNS, DHCP und WLAN","minutes":12,"html":"<p>DNS löst Namen in IP-Adressen auf. DHCP weist Geräten automatisch IP-Konfigurationen zu. WLAN benötigt angemessene Verschlüsselung wie WPA3 und eine sorgfältige Netzplanung.</p><p><strong>Praxisbeispiel:</strong> Ein Notebook erhält per DHCP eine Adresse und fragt per DNS die Server-IP ab.</p><p class=\"note\"><strong>Merksatz:</strong> DNS = Namen; DHCP = Konfiguration.</p>"}],"questions":[{"q":"Welche Aussage zu „Netzwerkgeräte“ trifft zu?","opts":["Switch = LAN, Router = Netzübergang.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Ein Switch verbindet Geräte im LAN anhand von MAC-Adressen. Ein Router verbindet unterschiedliche IP-Netze und leitet Pakete anhand der Routingtabelle weiter."},{"q":"Was ist ein passendes Praxisbeispiel für „Netzwerkgeräte“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Büro-PCs am Switch; Router stellt Verbindung zum Internet her.","Eine Entscheid z 192.168.10.0/24."],["DNS, DHCP und WLAN","DNS = Namen; DHCP = Konfiguration."],["DNS, DHCP und WLAN – Beispiel","Ein Notebook erhält per DHCP eine Adresse und fragt per DNS die Server-IP ab."]]},{"id":3,"title":"Hardware, Software & Cloud","lessons":[{"title":"Komponenten auswählen","minutes":12,"html":"<p>CPU, RAM, SSD, Netzteil und Anschlüsse müssen zum Einsatzzweck passen. Dimensioniere nach Anwendungen, Nutzungsdauer, Support und Gesamtkosten.</p><p><strong>Praxisbeispiel:</strong> Für CAD sind andere Anforderungen wichtig als für E-Mail und Office.</p><p class=\"note\"><strong>Merksatz:</strong> Anforderungen vor Produktwahl.</p>"},{"title":"Virtualisierung und Cloud","minutes":12,"html":"<p>Virtualisierung erlaubt mehrere virtuelle Maschinen auf einem Host. IaaS liefert Infrastruktur, PaaS eine Plattform, SaaS fertige Anwendungen. Cloud erfordert Prüfung von Datenschutz und Verfügbarkeit.</p><p><strong>Praxisbeispiel:</strong> Virtueller Server ist IaaS; Online-CRM meist SaaS.</p><p class=\"note\"><strong>Merksatz:</strong> IaaS Infrastruktur, PaaS Plattform, SaaS Software.</p>"},{"title":"Betrieb und Wartung","minutes":12,"html":"<p>Updates schließen Sicherheitslücken. Monitoring erkennt Ausfälle. Wartungsfenster, Dokumentation und Wiederherstellungstests reduzieren Betriebsrisiken.</p><p><strong>Praxisbeispiel:</strong> Vor einem Server-Update wird ein Backup geprüft.</p><p class=\"note\"><strong>Merksatz:</strong> Backup allein ist kein getesteter Restore.</p>"}],"questions":[{"q":"Welche Aussage zu „Komponenten auswählen“ trifft zu?","opts":["Anforderungen vor Produktwahl.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"CPU, RAM, SSD, Netzteil und Anschlüsse müssen zum Einsatzzweck passen. Dimensioniere nach Anwendungen, Nutzungsdauer, Support und Gesamtkosten."},{"q":"Was ist ein passendes Praxisbeispiel für „Komponenten auswählen“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Für CAD sind andere Anforderungen wichtig als für E-Mail und Office.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: Für CAD sind andere Anforderungen wichtig als für E-Mail und Office."},{"q":"Welche Aussage zu „Virtualisierung und Cloud“ trifft zu?","opts":["IaaS Infrastruktur, PaaS Plattform, SaaS Software.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Virtualisierung erlaubt mehrere virtuelle Maschinen auf einem Host. IaaS liefert Infrastruktur, PaaS eine Plattform, SaaS fertige Anwendungen. Cloud erfordert Prüfung von Datenschutz und Verfügbarkeit."},{"q":"Was ist ein passendes Praxisbeispiel für „Virtualisierung und Cloud“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Virtueller Server ist IaaS; Online-CRM meist SaaS.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: Virtueller Server ist IaaS; Online-CRM meist SaaS."},{"q":"Welche Aussage zu „Betrieb und Wartung“ trifft zu?","opts":["Backup allein ist kein getesteter Restore.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Updates schließen Sicherheitslücken. Monitoring erkennt Ausfälle. Wartungsfenster, Dokumentation und Wiederherstellungstests reduzieren Betriebsrisiken."},{"q":"Was ist ein passendes Praxisbeispiel für „Betrieb und Wartung“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Vor einem Server-Update wird ein Backup geprüft.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: Vor einem Server-Update wird ein Backup geprüft."}],"cards":[["Komponenten auswählen","Anforderungen vor Produktwahl."],["Komponenten auswählen – Beispiel","Für CAD sind andere Anforderungen wichtig als für E-Mail und Office."],["Virtualisierung und Cloud","IaaS Infrastruktur, PaaS Plattform, SaaS Software."],["Virtualisierung und Cloud – Beispiel","Virtueller Server ist IaaS; Online-CRM meist SaaS."],["Betrieb und Wartung","Backup allein ist kein getesteter Restore."],["Betrieb und Wartung – Beispiel","Vor einem Server-Update wird ein Backup geprüft."]]},{"id":4,"title":"IT-Sicherheit & Datenschutz","lessons":[{"title":"Schutzziele und Risiken","minutes":12,"html":"<p>Vertraulichkeit, Integrität und Verfügbarkeit sind zentrale Schutzziele. Risiken ergeben sich aus Bedrohungen, Schwachstellen und möglichen Schäden.</p><p><strong>Praxisbeispiel:</strong> Ransomware gefährdet Verfügbarkeit und Integrität.</p><p class=\"note\"><strong>Merksatz:</strong> CIA: Confidentiality, Integrity, Availability.</p>"},{"title":"Technische Maßnahmen","minutes":12,"html":"<p>Mehrfaktor-Authentifizierung, Rechte nach Need-to-know, Patchmanagement, Verschlüsselung und getrennte Backups schützen Systeme. Das 3-2-1-Prinzip ist eine verbreitete Backup-Faustregel.</p><p><strong>Praxisbeispiel:</strong> Drei Datenkopien auf zwei Medientypen, eine außer Haus.</p><p class=\"note\"><strong>Merksatz:</strong> Sicherung regelmäßig wiederherstellen und testen.</p>"},{"title":"DSGVO im Projekt","minutes":12,"html":"<p>Personenbezogene Daten brauchen eine Rechtsgrundlage und zweckgebundene Verarbeitung. Datenminimierung, Löschkonzepte und geeignete Auftragsverarbeitungsverträge können nötig sein.</p><p><strong>Praxisbeispiel:</strong> Ein Cloud-Dienstleister verarbeitet Kundendaten im Auftrag.</p><p class=\"note\"><strong>Merksatz:</strong> Datenschutz früh in die Lösungsauswahl aufnehmen.</p>"}],"questions":[{"q":"Welche Aussage zu „Schutzziele und Risiken“ trifft zu?","opts":["CIA: Confidentiality, Integrity, Availability.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Vertraulichkeit, Integrität und Verfügbarkeit sind zentrale Schutzziele. Risiken ergeben sich aus Bedrohungen, Schwachstellen und möglichen Schäden."},{"q":"Was ist ein passendes Praxisbeispiel für „Schutzziele und Risiken“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Ransomware gefährdet Verfügbarkeit und Integrität.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: Ransomware gefährdet Verfügbarkeit und Integrität."},{"q":"Welche Aussage zu „Technische Maßnahmen“ trifft zu?","opts":["Sicherung regelmäßig wiederherstellen und testen.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Mehrfaktor-Authentifizierung, Rechte nach Need-to-know, Patchmanagement, Verschlüsselung und getrennte Backups schützen Systeme. Das 3-2-1-Prinzip ist eine verbreitete Backup-Faustregel."},{"q":"Was ist ein passendes Praxisbeispiel für „Technische Maßnahmen“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Drei Datenkopien auf zwei Medientypen, eine außer Haus.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: Drei Datenkopien auf zwei Medientypen, eine außer Haus."},{"q":"Welche Aussage zu „DSGVO im Projekt“ trifft zu?","opts":["Datenschutz früh in die Lösungsauswahl aufnehmen.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Personenbezogene Daten brauchen eine Rechtsgrundlage und zweckgebundene Verarbeitung. Datenminimierung, Löschkonzepte und geeignete Auftragsverarbeitungsverträge können nötig sein."},{"q":"Was ist ein passendes Praxisbeispiel für „DSGVO im Projekt“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Ein Cloud-Dienstleister verarbeitet Kundendaten im Auftrag.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: Ein Cloud-Dienstleister verarbeitet Kundendaten im Auftrag."}],"cards":[["Schutzziele und Risiken","CIA: Confidentiality, Integrity, Availability."],["Schutzziele und Risiken – Beispiel","Ransomware gefährdet Verfügbarkeit und Integrität."],["Technische Maßnahmen","Sicherung regelmäßig wiederherstellen und testen."],["Technische Maßnahmen – Beispiel","Drei Datenkopien auf zwei Medientypen, eine außer Haus."],["DSGVO im Projekt","Datenschutz früh in die Lösungsauswahl aufnehmen."],["DSGVO im Projekt – Beispiel","Ein Cloud-Dienstleister verarbeitet Kundendaten im Auftrag."]]},{"id":5,"title":"Kundenberatung & Bedarf","lessons":[{"title":"Gesprächsführung","minutes":12,"html":"<p>Offene Fragen klären Probleme, Ziele und Nutzergruppen. Geschlossene Fragen verifizieren Fakten. Ergebnisse werden verständlich dokumentiert und rückbestätigt.</p><p><strong>Praxisbeispiel:</strong> Was funktioniert heute nicht? Wie viele Nutzer arbeiten gleichzeitig?</p><p class=\"note\"><strong>Merksatz:</strong> Erst verstehen, dann anbieten.</p>"},{"title":"Anforderungen priorisieren","minutes":12,"html":"<p>Muss-, Soll- und Kann-Anforderungen helfen bei knappen Budgets. Funktionale Anforderungen beschreiben Fähigkeiten, nichtfunktionale etwa Sicherheit und Antwortzeiten.</p><p><strong>Praxisbeispiel:</strong> Muss: Rechnungen exportieren. Soll: mobile Ansicht.</p><p class=\"note\"><strong>Merksatz:</strong> Priorität mit Kunden abstimmen.</p>"},{"title":"Lösungen präsentieren","minutes":12,"html":"<p>Vergleiche Optionen anhand transparenter Kriterien wie Nutzen, Kosten, Risiko, Datenschutz und Service. Keine unbewiesenen Versprechen über Produkte machen.</p><p><strong>Praxisbeispiel:</strong> Kaufserver gegen Cloudlösung mit TCO-Vergleich.</p><p class=\"note\"><strong>Merksatz:</strong> Empfehlung begründen statt nur Preis nennen.</p>"}],"questions":[{"q":"Welche Aussage zu „Gesprächsführung“ trifft zu?", "Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Druckerausfall als Incident; wiederkehrende Ursache als Problem.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: Druckerausfall als Incident; wiederkehrende Ursache als Problem."}],"cards":[["Serviceleistungen","SLA-Kennzahlen präzise formulieren."],["Serviceleistungen – Beispiel","Vier Stunden Reaktion bedeuten nicht vier Stunden Reparatur."],["Rollout und Übergabe","Abnahme an vereinbarten Kriterien messen."],["Rollout und Übergabe – Beispiel","Zuerst fünf Pilotnutzer, dann gesamte Abteilung."],["Support und Störungen","Priorität nach Auswirkung und Dringlichkeit."],["Support und Störungen – Beispiel","Druckerausfall als Incident; wiederkehrende Ursache als Problem."]]},{"id":7,"title":"Angebote & Kalkulation","lessons":[{"title":"Angebotsbestandteile","minutes":12,"html":"<p>Ein nachvollziehbares Angebot enthält Leistungsumfang, Mengen, Einzel- und Gesamtpreise, Steuern, Lieferbedingungen, Gültigkeit und gegebenenfalls Service.</p><p><strong>Praxisbeispiel:</strong> Hardware plus Einrichtung und Schulung getrennt ausweisen.</p><p class=\"note\"><strong>Merksatz:</strong> Alle Annahmen transparent machen.</p>"},{"title":"Zuschlagskalkulation","minutes":12,"html":"<p>Bei der Zuschlagskalkulation werden Einzelkosten um passende Gemeinkostenzuschläge ergänzt. Gewinn und gegebenenfalls Umsatzsteuer werden getrennt berücksichtigt.</p><p><strong>Praxisbeispiel:</strong> 100 € Einstand + 20 % Zuschlag = 120 € vor weiteren Bestandteilen.</p><p class=\"note\"><strong>Merksatz:</strong> Prozentbasis immer prüfen.</p>"},{"title":"TCO und Wirtschaftlichkeit","minutes":12,"html":"<p>Total Cost of Ownership berücksichtigt Anschaffung, Betrieb, Energie, Lizenzen, Wartung und Entsorgung. Amortisation beschreibt, wann Einsparungen die Investition ausgleichen.</p><p><strong>Praxisbeispiel:</strong> Günstiger Drucker kann wegen Tonerkosten teurer sein.</p><p class=\"note\"><strong>Merksatz:</strong> Nicht nur Anschaffungspreis vergleichen.</p>"}],"questions":[{"q":"Welche Aussage zu „Angebotsbestandteile“ trifft zu?","opts":["Alle Annahmen transparent machen.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Ein nachvollziehbares Angebot enthält Leistungsumfang, Mengen, Einzel- und Gesamtpreise, Steuern, Lieferbedingungen, Gültigkeit und gegebenenfalls Service."},{"q":"Was ist ein passendes Praxisbeispiel für „Angebotsbestandteile“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Hardware plus Einrichtung und Schulung getrennt ausweisen.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: Hardware plus Einrichtung und Schulung getrennt ausweisen."},{"q":"Welche Aussage zu „Zuschlagskalkulation“ trifft zu?","opts":["Prozentbasis immer prüfen.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Bei der Zuschlagskalkulation werden Einzelkosten um passende Gemeinkostenzuschläge ergänzt. Gewinn und gegebenenfalls Umsatzsteuer werden getrennt berücksichtigt."},{"q":"Was ist ein passendes Praxisbeispiel für „Zuschlagskalkulation“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","100 € Einstand + 20 % Zuschlag = 120 € vor weiteren Bestandteilen.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: 100 € Einstand + 20 % Zuschlag = 120 € vor weiteren Bestandteilen."},{"q":"Welche Aussage zu „TCO und Wirtschaftlichkeit“ trifft zu?","opts":["Nicht nur Anschaffungspreis vergleichen.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Total Cost of Ownership berücksichtigt Anschaffung, Betrieb, Energie, Lizenzen, Wartung und Entsorgung. Amortisation beschreibt, wann Einsparungen die Investition ausgleichen."},{"q":"Was ist ein passendes Praxisbeispiel für „TCO und Wirtschaftlichkeit“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Günstiger Drucker kann wegen Tonerkosten teurer sein.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: Günstiger Drucker kann wegen Tonerkosten teurer sein."}],"cards":[["Angebotsbestandteile","Alle Annahmen transparent machen."],["Angebotsbestandteile – Beispiel","Hardware plus Einrichtung und Schulung getrennt ausweisen."],["Zuschlagskalkulation","Prozentbasis immer prüfen."],["Zuschlagskalkulation – Beispiel","100 € Einstand + 20 % Zuschlag = 120 € vor weiteren Bestandteilen."],["TCO und Wirtschaftlichkeit","Nicht nur Anschaffungspreis vergleichen."],["TCO und Wirtschaftlichkeit – Beispiel","Günstiger Drucker kann wegen Tonerkosten teurer sein."]]},{"id":8,"title":"Beschaffung, Verträge & Lizenzen","lessons":[{"title":"Beschaffungsprozess","minutes":12,"html":"<p>Von Bedarfsanforderung über Lieferantenauswahl und Bestellung bis Wareneingang, Rechnungsprüfung und Zahlung sind Zuständigkeiten zu dokumentieren.</p><p><strong>Praxisbeispiel:</strong> Drei Angebote nach Preis, Qualität und Lieferzeit vergleichen.</p><p class=\"note\"><strong>Merksatz:</strong> Gesamtnutzen statt billigster Preis.</p>"},{"title":"Vertragsarten","minutes":12,"html":"<p>Kauf-, Miet-, Werk- und Dienstverträge unterscheiden sich nach geschuldeter Leistung. Beim Werkvertrag ist typischerweise ein Erfolg geschuldet, beim Dienstvertrag die Tätigkeit.</p><p><strong>Praxisbeispiel:</strong> Ein definiert funktionsfähiges System kann Werkvertragsbezug haben.</p><p class=\"note\"><strong>Merksatz:</strong> Vertragstyp im Einzelfall prüfen.</p>"},{"title":"Softwarelizenzen","minutes":12,"html":"<p>Lizenzen können pro Nutzer, Gerät, Nutzung oder Laufzeit gelten. Compliance erfordert Inventar, Bedingungen  und Qualität","minutes":12,"html":"<p>Energieverbrauch, Lebensdauer, Reparierbarkeit und Entsorgung fließen in Beschaffungsentscheidungen ein. Qualitätskontrollen verbessern Prozesse kontinuierlich.</p><p><strong>Praxisbeispiel:</strong> Refurbished-Geräte können Ressourcen sparen.</p><p class=\"note\"><strong>Merksatz:</strong> Wirtschaftlichkeit und Nachhaltigkeit gemeinsam bewerten.</p>"}],"questions":[{"q":"Welche Aussage zu „Prozesse modellieren“ trifft zu?","opts":["Medienbrüche und Wartezeiten erkennen.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Ein Prozess hat Auslöser, Aktivitäten, Verantwortlichkeiten, Schnittstellen und Ergebnis. Soll-Prozesse werden mit Ist-Prozessen verglichen."},{"q":"Was ist ein passendes Praxisbeispiel für „Prozesse modellieren“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Vom Kundenauftrag bis zur Rechnungsstellung.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: Vom Kundenauftrag bis zur Rechnungsstellung."},{"q":"Welche Aussage zu „Kennzahlen auswerten“ trifft zu?","opts":["Zahlen nur im Kontext interpretieren.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Kennzahlen wie Durchlaufzeit, Fehlerquote, Deckungsbeitrag und Kundenzufriedenheit unterstützen Entscheidungen. Einheit und Messzeitraum müssen klar sein."},{"q":"Was ist ein passendes Praxisbeispiel für „Kennzahlen auswerten“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","20 fehlerhafte von 400 Vorgängen = 5 % Fehlerquote.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: 20 fehlerhafte von 400 Vorgängen = 5 % Fehlerquote."},{"q":"Welche Aussage zu „Nachhaltigkeit und Qualität“ trifft zu?","opts":["Wirtschaftlichkeit und Nachhaltigkeit gemeinsam bewerten.","Bei diesem Thema sind Anforderungen und Dokumentation grundsätzlich unwichtig.","Die günstigste Option ist immer automatisch die beste Lösung."],"a":0,"why":"Energieverbrauch, Lebensdauer, Reparierbarkeit und Entsorgung fließen in Beschaffungsentscheidungen ein. Qualitätskontrollen verbessern Prozesse kontinuierlich."},{"q":"Was ist ein passendes Praxisbeispiel für „Nachhaltigkeit und Qualität“?","opts":["Ein Projekt ohne dokumentierte Entscheidungen und ohne Prüfungen.","Refurbished-Geräte können Ressourcen sparen.","Eine Entscheidung allein nach dem Zufallsprinzip."],"a":1,"why":"Passendes Beispiel: Refurbished-Geräte können Ressourcen sparen."}],"cards":[["Prozesse modellieren","Medienbrüche und Wartezeiten erkennen."],["Prozesse modellieren – Beispiel","Vom Kundenauftrag bis zur Rechnungsstellung."],["Kennzahlen auswerten","Zahlen nur im Kontext interpretieren."],["Kennzahlen auswerten – Beispiel","20 fehlerhafte von 400 Vorgängen = 5 % Fehlerquote."],["Nachhaltigkeit und Qualität","Wirtschaftlichkeit und Nachhaltigkeit gemeinsam bewerten."],["Nachhaltigkeit und Qualität – Beispiel","Refurbished-Geräte können Ressourcen sparen."]]},{"id":11,"title":"Wirtschafts- & Sozialkunde","lessons":[{"title":"Ausbildung und Arbeitsrecht","minutes":12,"html":"<p>Ausbildungs- und Arbeitsverhältnisse haben Rechte und Pflichten. Arbeitszeit, Urlaub, Kündigung und Mitbestimmung hängen von gesetzlichen und vertraglichen Regeln ab.</p><p><strong>Praxisbeispiel:</strong> Bei Arbeitszeiten auch Pausenregelungen berücksichtigen.</p><p class=\"note\"><strong>Merksatz:</strong> Aktuelle Rechtslage und Vertrag prüfen.</p>"},{"title":"Soziale Sicherung","minutes":12,"html":"<p>Die gesetzliche Sozialversicherung umfasst Kranken-, Pflege-, Renten-, Arbeitslosen- und Unfallversicherung. Finanzierung und Zuständigkeiten unterscheiden sich.</p><p><strong>Praxisbeispiel:</strong> Unfallversicherung wird grundsätzlich durch Arbeitgeberbeiträge fin const KEY='ihk-coach-2027-v2',OLD='ihk-coach-2027-v1';
let state={active:1,progress:{}};
try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.progress)state=x;else{let legacy=JSON.parse(localStorage.getItem(OLD)||'null');if(legacy)state.progress['1']={completed:legacy.completed||[],best:legacy.best??null,attempts:legacy.attempts||0,cardKnown:legacy.cardKnown||[],quizAnswers:legacy.quizAnswers||{},quizChecked:legacy.quizChecked||false,cardIndex:legacy.cardIndex||0,flipped:legacy.flipped||false}}}catch(e){}
let tab='home';const view=document.getElementById('view');
function mod(){return modules.find(m=>m.id===state.active)||modules[0]}
function prog(id=state.active){if(!state.progress[id])state.progress[id]={completed:[],best:null,attempts:0,cardKnown:[],quizAnswers:{},quizChecked:false,cardIndex:0,flipped:false};return state.progress[id]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateStats(){let m=mod(),p=prog(),n=p.completed.filter(x=>x>=0&&x<m.lessons.length).length;document.getElementById('pct').textContent=Math.round(n/m.lessons.length*100)+' %';document.getElementById('topbar').style.width=n/m.lessons.length*100+'%';document.getElementById('statLessons').textContent=n+'/'+m.lessons.length;document.getElementById('statQuiz').textContent=p.best===null?'–':p.best+'/'+m.questions.length;}
function render(){updateStats();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({home,lessons:renderLessons,quiz:renderQuiz,cards:renderCards,exam:renderExam,progress:renderProgress}[tab]||home)()}
function bindGo(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render();window.scrollTo(0,0)})}
function home(){let m=mod(),done=modules.reduce((n,x)=>n+(prog(x.id).completed.length===x.lessons.length?1:0),0);view.innerHTML=`<section class="panel"><h2>📚 Wähle dein Lernmodul</h2><p class="muted">${modules.length} Module · ${done} vollständig gelesene Module · alle Inhalte auch offline nach dem Update.</p><div class="stack">${modules.map(x=>{let p=prog(x.id),n=p.completed.filter(i=>i<x.lessons.length).length;return `<button class="option" data-mod="${x.id}"><strong>${x.id}. ${esc(x.title)}</strong><br><small>${n}/${x.lessons.length} Lektionen · ${x.questions.length} Quizfragen · ${x.cards.length} Karten ${x.id===state.active?'· ausgewählt':''}</small><div class="bar"><div style="width:${n/x.lessons.length*100}%"></div></div></button>`}).join('')}</div></section><section class="panel"><h2>Aktuell: Modul ${m.id} – ${esc(m.title)}</h2><p>Erst die Lektionen lesen, dann das Quiz lösen und die Karteikarten wiederholen.</p><button class="btn" data-go="lessons">Jetzt lernen →</button></section><section class="panel"><h2>⏱ Prüfungssimulation</h2><p>20 Fragen in 30 Minuten oder 60 Fragen in 90 Minuten – mit Auswertung und gespeicherten Ergebnissen.</p><button class="btn" data-go="exam">Prüfung üben →</button></section><section class="panel"><h2>Hinweis zur Prüfung</h2><p class="muted small">Eigene Lerninhalte und Übungsfragen, keine offiziellen IHK-Prüfungsaufgaben. Die Projektarbeit und die konkreten Vorgaben bitte mit der zuständigen IHK und dem Praktikumsbetrieb klären.</p></section>`;document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{state.active=+b.dataset.mod;save();render();window.scrollTo(0,0)});bindGo()}
function renderLessons(){let m=mod(),p=prog();view.innerHTML=`<section class="panel"><h2>📘 Modul ${m.id}: ${esc(m.title)}</h2><p>Arbeite die Lektionen durch und markiere sie nach dem Verstehen.</p></section>`+m.lessons.map((l,i)=>`<section class="panel"><div class="row"><h2>${i+1}. ${esc(l.title)}</h2><span class="chip">${l.minutes} Min.</span></div><details ${i===0&&!p.completed.includes(0)?'open':''}><summary>Inhalt ${p.completed.includes(i)?'✓ erledigt':''}</summary>${l.html}</details><label class="checkline"><input type="checkbox" data-lesson="${i}" ${p.completed.includes(i)?'checked':''}>Lektion verstanden</label></section>`).join('')+`<section class="panel"><button class="btn" data-go="quiz">Zum Quiz →</button></section>`;document.querySelectorAll('[data-lesson]').forEach(el=>el.onchange=()=>{let i=+el.dataset.lesson;p.completed=el.checked?[...new Set([...p.completed,i])].sort((a,b)=>a-b):p.completed.filter(x=>x!==i);save();render()});bindGo()}
function renderQuiz(){let m=mod(),p=prog(),answered=Object.keys(p.quizAnswers).length;view.innerHTML=`<section class="panel"><h2>🧠 Quiz: ${esc(m.title)}</h2><p>${answered}/${m.questions.length} beantwortet · eigene Übungsfragen</p></section>`+m.questions.map((q,i)=>`<section class="panel"><h2>Frage ${i+1} von ${m.questions.length}</h2><p><strong>${esc(q.q)}</strong></p>${q.opts.map((o,j)=>`<button class="option ${p.quizAnswers[i]===j?'selected':''} ${p.quizChecked&&j===q.a?'correct':''} ${p.quizChecked&&p.quizAnswers[i]===j&&j!==q.a?'wrong':''}" data-q="${i}" data-a="${j}" ${p.quizChecked?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}${p.quizChecked?`<div class="feedback"><strong>${p.quizAnswers[i]===q.a?'✓ Richtig':'✗ Nicht richtig'}</strong><p>${esc(q.why)}</p></div>`:''}</section>`).join('')+`<section class="panel"><div class="row"><button class="btn" id="grade" ${answered<m.questions.length||p.quizChecked?'disabled':''}>Auswerten</button><button class="btn secondary" id="resetQuiz">Neu beginnen</button></div>${p.quizChecked?`<h2>Ergebnis: ${m.questions.filter((q,i)=>p.quizAnswers[i]===q.a).length}/${m.questions.length}</h2>`:''}</section>`;document.querySelectorAll('[data-q]').forEach(el=>el.onclick=()=>{p.quizAnswers[el.dataset.q]=+el.dataset.a;save();renderQuiz()});document.getElementById('grade').onclick=()=>{p.quizChecked=true;p.attempts++;p.best=Math.max(p.best??0,m.questions.filter((q,i)=>p.quizAnswers[i]===q.a).length);save();render()};document.getElementById('resetQuiz').onclick=()=>{p.quizAnswers={};p.quizChecked=false;save();renderQuiz()}}
function renderCards(){let m=mod(),p=prog(),i=p.cardIndex%m.cards.length,c=m.cards[i];view.innerHTML=`<section class="panel"><h2>🗂️ Karteikarten: ${esc(m.title)}</h2><p>Karte ${i+1}/${m.cards.length} · ${p.cardKnown.length} gelernt</p><div class="bar"><div style="width:${p.cardKnown.length/m.cards.length*100}%"></div></div></section><section class="panel"><div class="flash" id="flip" role="button" tabindex="0"><div><b>${esc(p.flipped?c[1]:c[0])}</b><small>Tippen zum Umdrehen</small></div></div><div class="row" style="margin-top:16px"><button class="btn secondary" id="prev">← Zurück</button><button class="btn" id="next">Weiter →</button></div><label class="checkline"><input id="known" type="checkbox" ${p.cardKnown.includes(i)?'checked':''}>Begriff beherrscht</label></section>`;function move(d){p.cardIndex=(i+d+m.cards.length)%m.cards.length;p.flipped=false;save();renderCards()}function flip(){p.flipped=!p.flipped;save();renderCards()}document.getElementById('flip').onclick=flip;document.getElementById('flip').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('known').onchange=e=>{p.cardKnown=e.target.checked?[...new Set([...p.cardKnown,i])]:p.cardKnown.filter(x=>x!==i);save();renderCards()}}
function renderProgress(){let m=mod(),p=prog();view.innerHTML=`<section class="panel"><h2>📊 Lernfortschritt</h2><p><strong>Modul ${m.id}: ${esc(m.title)}</strong></p><p>Lektionen: ${p.completed.length}/${m.lessons.length}</p><p>Karteikarten: ${p.cardKnown.length}/${m.cards.length}</p><p>Quizversuche: ${p.attempts} · Bestwert: ${p.best===null?'–':p.best+'/'+m.questions.length}</p></section><section class="panel"><h2>Alle Module</h2>${modules.map(x=>{let y=prog(x.id);return `<p>${x.id}. ${esc(x.title)}: ${y.completed.length}/${x.lessons.length} Lektionen · Quiz ${y.best===null?'–':y.best+'/'+x.questions.length}</p>`}).join('')}</section><section class="panel"><h2>Fortschritt sichern</h2><p class="muted small">Der Fortschritt wird lokal auf diesem Gerät gespeichert. Vor Gerätewechsel oder Löschen der Browserdaten bitte exportieren. Kein automatischer Abgleich zwischen Geräten.</p><div class="row"><button class="btn secondary" id="export">Exportieren</button><label class="btn ghost">Importieren<input id="import" type="file" accept="application/json,.json" style="display:none"></label></div><p id="importMsg"></p></section>`;document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:KEY,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ihk-lernstand-2027.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};document.getElementById('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(d.app!==KEY||!d.state?.progress)throw Error('Dateiformat nicht passend');state=d.state;state.active=modules.some(m=>m.id===state.active)?state.active:1;save();render()}catch(err){document.getElementById('importMsg').textContent='Import fehlgeschlagen: '+err.message}}}

ern","Mehrfaktor-Authentifizierung aktivieren","Ein Konto für alle Mitarbeitenden verwenden"],"a":2,"why":"MFA erschwert den Missbrauch gestohlener Passwörter."},{"area":"it","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Ein bildungsanbieter möchte Kundendaten an einen Cloud-Dienstleister auslagern. Was sollte vor Vertragsabschluss besonders geprüft werden?","opts":["Ob der Anbieter Werbegeschenke anbietet","Nur die Farbe des Verwaltungsportals","Ob Passwörter öffentlich geteilt werden können","Datenschutz, Auftragsverarbeitung und technische Schutzmaßnahmen"],"a":3,"why":"Bei personenbezogenen Daten sind unter anderem Rollen, Sicherheitsmaßnahmen und ggf. ein Auftragsverarbeitungsvertrag zu klären."},{"area":"business","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Ein bildungsanbieter kauft 39 Monitore zu je 840 € netto. Wie hoch ist die Umsatzsteuer bei 19 %?","opts":["2293.20 €","38984.40 €","32760.00 €","6224.40 €"],"a":3,"why":"Nettobetrag 39 × 840 € = 32760 €. Davon 19 % = 6224.40 €."},{"area":"business","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Für ein Bildungsanbieter wird ein Gerät für 950 € netto eingekauft und für 1430 € netto verkauft. Wie hoch ist der Stückdeckungsbeitrag, wenn nur der Einkaufspreis als variable Kosten anfällt?","opts":["2380 €","950 €","480 €","1430 €"],"a":2,"why":"Deckungsbeitrag = Nettoerlös − variable Kosten = 1430 − 950 = 480 €."},{"area":"business","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Ein Serviceangebot für ein Bildungsanbieter verursacht 11400 € Fixkosten. Der Deckungsbeitrag je Auftrag beträgt 285 €. Wie viele Aufträge sind zum Erreichen der Gewinnschwelle nötig?","opts":["285 Aufträge","40 Aufträge","50 Aufträge","20 Aufträge"],"a":1,"why":"Break-even-Menge = Fixkosten / Stückdeckungsbeitrag = 11400/285 = 40."},{"area":"business","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Für die Einrichtung der IT bei ein Bildungsanbieter werden 32 Arbeitsstunden mit 130 € netto pro Stunde kalkuliert. Wie hoch sind die Personalleistungen netto?","opts":["4160 €","8320 €","4290 €","162 €"],"a":0,"why":"32 Stunden × 130 €/Stunde = 4160 € netto."},{"area":"business","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Ein Lieferant bietet ein Bildungsanbieter auf einen Nettolistenpreis von 1900 € einen Rabatt von 14 %. Wie hoch ist der Zieleinkaufspreis vor Skonto?","opts":["1634.00 €","2166.00 €","1900.00 €","266.00 €"],"a":0,"why":"1900 € × (1 − 14/100) = 1634.00 €."},{"area":"business","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Ein bildungsanbieter bezahlt eine Rechnung über 3800 € netto innerhalb der Skontofrist und darf 2 % Skonto abziehen. Welcher Nettobetrag ist zu zahlen?","opts":["76.00 €","3876.00 €","3800.00 €","3724.00 €"],"a":3,"why":"3800 € × (1 − 2/100) = 3724.00 €. Umsatzsteuerliche Korrekturen sind hier nicht Teil der Frage."},{"area":"business","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Ein Software-Abonnement für ein Bildungsanbieter kostet 210 € monatlich. Welche Nettokosten entstehen über 3 volle Jahre bei konstantem Preis?","opts":["7560 €","630 €","7770 €","2520 €"],"a":0,"why":"210 € × 12 Monate × 3 Jahre = 7560 €."},{"area":"business","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Für ein Bildungsanbieter stehen zwei Lösungen zur Wahl: A kostet einmalig 7600 € plus 2100 €/Jahr, B kostet einmalig 10500 € plus 1050 €/Jahr. Nach wie vielen Jahren sind die kumulierten Kosten gleich?","opts":["3.76 Jahre","2.76 Jahre","0.92 Jahre","4.76 Jahre"],"a":1,"why":"Gleichsetzen: 7600+2100×t = 10500+1050×t, also t = (10500−7600)/(2100−1050) = 2.76 Jahre."},{"area":"business","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Ein bildungsanbieter beschafft ein Wirtschaftsgut für 4560 € netto. Bei linearer Abschreibung über 4 Jahre und vollem Nutzungsjahr: Wie hoch ist die jährliche Abschreibung?","opts":["18240 €","4560 €","2280 €","1140 €"],"a":3,"why":"Lineare Abschreibung = Anschaffungskosten / Nutzungsdauer = 4560/4 = 1140 € pro Jahr (vereinfachte Annahme)."},{"area":"business","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Im Projekt für ein Bildungsanbieter sind 29000 € Erlöse geplant, tatsächlich wurden 25100 € erzielt. Wie groß ist die negative Planabweichung?","opts":["29000 €","25100 €","3900 €","54100 €"],"a":2,"why":"Plan minus Ist = 29000 − 25100 = 3900 € Mindererlös."},{"area":"wiso","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Bei ein Bildungsanbieter entsteht folgende Situation: Ein Auszubildender soll regelmäßig über die vereinbarte Ausbildungszeit hinaus arbeiten. Was ist die sachgerechte erste Prüfung?","opts":["Mehrarbeit ohne Dokumentation anordnen","Ausbildungsnachweis dauerhaft einstellen","Ausbildungsvertrag, Arbeitszeitregeln und geltende Schutzvorschriften prüfen","Arbeitszeit allein nach Umsatz festlegen"],"a":2,"why":"Arbeitszeit und Mehrarbeit richten sich nach Vertrag, Gesetz und ggf. Tarifvertrag; bei Minderjährigen gelten besondere Regeln."},{"area":"wiso","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Bei ein Bildungsanbieter entsteht folgende Situation: Die Personalabteilung möchte personenbezogene Bewerbungsunterlagen verarbeiten. Was ist besonders wichtig?","opts":["Zweckbindung, Rechtsgrundlage und angemessene Löschfristen","Unterlagen ohne Zweck an Kunden weitergeben","Bewerbungen dauerhaft öffentlich speichern","Einwilligung immer als einzige mögliche Rechtsgrundlage annehmen"],"a":0,"why":"Datenschutz erfordert rechtmäßige, zweckgebundene und zeitlich begrenzte Verarbeitung."},{"area":"wiso","case":"Kundenauftrag 10: Ein bildungsanbieter modernisiert die IT.","q":"Bei ein Bildungsanbieter entsteht folgende Situation: Im Team gibt es einen Konflikt über let examTimer=null;
function examData(){if(!state.exams||typeof state.exams!=='object')state.exams={active:null,history:[]};if(!Array.isArray(state.exams.history))state.exams.history=[];return state.exams}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(area){return realisticPool.filter(q=>!area||q.area===area).map((q,i)=>({...q,moduleId:q.area==='it'?2:q.area==='business'?8:12,moduleTitle:q.area==='it'?'IT-Systemlösungen':q.area==='business'?'Kaufmännische Prozesse':'Wirtschafts- und Sozialkunde'}))}
function examLabel(mode){return ({short:'Kurzprüfung',full:'Große Prüfung',it:'IT-Systemlösung',business:'Kaufmännische Prozesse',wiso:'Wirtschafts- und Sozialkunde'})[mode]||'Prüfung'}
function makeExam(mode){let settings={short:[20,30,null],full:[60,90,null],it:[30,90,'it'],business:[30,90,'business'],wiso:[20,60,'wiso']};let [count,mins,area]=settings[mode]||settings.short;let chosen=shuffle([...pool(area)]).slice(0,count);return {id:Date.now(),mode,minutes:mins,startedAt:Date.now(),deadline:Date.now()+mins*60000,items:chosen,answers:{},index:0}}

function remaining(ex){return Math.max(0,Math.ceil((ex.deadline-Date.now())/1000))}
function clockFormat(seconds){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function stopExamTimer(){if(examTimer!==null){clearInterval(examTimer);examTimer=null}}
function startExamTimer(){stopExamTimer();examTimer=setInterval(()=>{let ex=examData().active;if(!ex){stopExamTimer();return}let left=remaining(ex);let clock=document.getElementById('examClock');if(clock){clock.textContent=clockFormat(left);clock.classList.toggle('urgent',left<300)}if(!left){finishExam(true);if(tab==='exam')renderExam()}},1000)}
function finishExam(expired=false){let d=examData(),ex=d.active;if(!ex)return;let correct=ex.items.filter((q,i)=>ex.answers[i]===q.a).length;d.history.unshift({...ex,finishedAt:Date.now(),expired,correct,total:ex.items.length,percent:Math.round(correct/ex.items.length*100)});d.history=d.history.slice(0,30);d.active=null;stopExamTimer();save()}
function renderExam(){let d=examData(),ex=d.active;stopExamTimer();if(ex&&remaining(ex)===0){finishExam(true);ex=null}
if(!ex){let last=d.history[0];view.innerHTML=`<section class="panel"><h2>⏱ IHK-Prüfungssimulation</h2><p>300 eigenständig formulierte, fallbezogene Übungsaufgaben (100 IT, 100 kaufmännisch, 100 WiSo). Keine offiziellen IHK-Prüfungsaufgaben. Die Simulation verwendet Multiple Choice und ersetzt keine schriftlichen offenen IHK-Fallaufgaben.</p><div class="stack"><div class="lesson"><h3>Kurzprüfung · 30 Minuten</h3><p>20 Fragen, sofortige Auswertung nach Abgabe.</p><button class="btn" data-exam-start="short">Kurzprüfung starten</button></div><div class="lesson"><h3>Große Prüfung · 90 Minuten</h3><p>60 Fragen aus dem neuen Aufgabenpool mit Countdown.</p><button class="btn" data-exam-start="full">Große Prüfung starten</button></div><div class="lesson"><h3>IT-Systemlösung · 90 Minuten</h3><p>30 fallbezogene Fragen zu IT-Systemen, Infrastruktur und Sicherheit.</p><button class="btn" data-exam-start="it">IT-Prüfung starten</button></div><div class="lesson"><h3>Kaufmännische Prozesse · 90 Minuten</h3><p>30 Aufgaben zu Kalkulation, Kosten und Wirtschaftlichkeit.</p><button class="btn" data-exam-start="business">Kaufmännische Prüfung starten</button></div><div class="lesson"><h3>Wirtschafts- und Sozialkunde · 60 Minuten</h3><p>20 Fragen zu Arbeitswelt, Datenschutz und Organisation.</p><button class="btn" data-exam-start="wiso">WiSo-Prüfung starten</button></div></div><p class="small muted">Antworten werden während der Prüfung auf diesem Gerät gespeichert. Die Zeit läuft auch weiter, wenn du die App schließt.</p></section>${last?`<section class="panel"><h2>Letztes Ergebnis</h2><p><strong>${last.correct}/${last.total} richtig (${last.percent} %)</strong> · ${examLabel(last.mode)} · ${new Date(last.finishedAt).toLocaleDateString('de-DE')}</p><button class="btn secondary" id="showExamResult">Auswertung ansehen</button></section>`:''}<section class="panel"><h2>Prüfungsverlauf</h2>${d.history.length?d.history.map((h,i)=>`<button class="option" data-exam-history="${i}">${new Date(h.finishedAt).toLocaleString('de-DE')} · ${examLabel(h.mode)} · ${h.correct}/${h.total} (${h.percent} %)</button>`).join(''):'<p>Noch keine abgeschlossene Prüfung.</p>'}</section>`;document.querySelectorAll('[data-exam-start]').forEach(b=>b.onclick=()=>{d.active=makeExam(b.dataset.examStart);save();renderExam();window.scrollTo(0,0)});document.querySelectorAll('[data-exam-history]').forEach(b=>b.onclick=()=>renderExamResult(+b.dataset.examHistory));if(last)document.getElementById('showExamResult').onclick=()=>renderExamResult(0);return}
let i=ex.index,q=ex.items[i],answered=Object.keys(ex.answers).length;view.innerHTML=`<section class="panel"><div class="row"><div><h2>${examLabel(ex.mode)}</h2><span class="small muted">${answered}/${ex.items.length} beantwortet · Frage ${i+1}/${ex.items.length}</span></div><div><div id="examClock" class="exam-clock">${clockFormat(remaining(ex))}</div><small>Restzeit</small></div></div><div class="bar"><div style="width:${answered/ex.items.length*100}%"></div></div></section><section class="panel"><span class="chip">Modul ${q.moduleId}: ${esc(q.moduleTitle)}</span><h2 style="margin-top:15px">Frage ${i+1}</h2><p><strong>${esc(q.q)}</strong></p>${q.opts.map((o,j)=>`<button class="option ${ex.answers[i]===j?'selected':''}" data-exam-answer="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}<div class="row" style="margin-top:18px"><button class="btn secondary" id="examPrev" ${i===0?'disabled':''}>← Zurück</button><button class="btn" id="examNext" ${i===ex.items.length-1?'disabled':''}>Weiter →</button></div></section><section class="panel"><h2>Fragenübersicht</h2><div class="exam-grid">${ex.items.map((_,j)=>`<button data-exam-jump="${j}" class="${ex.answers[j]!==undefined?'answered':''} ${j===i?'current':''}" aria-label="Frage ${j+1}">${j+1}</button>`).join('')}</div><p class="small muted">Blau = beantwortet. Du kannst Fragen jederzeit ändern.</p><button class="btn" id="examFinish">Prüfung abgeben</button></section>`;
document.querySelectorAll('[data-exam-answer]').forEach(b=>b.onclick=()=>{ex.answers[i]=+b.dataset.examAnswer;save();renderExam()});document.querySelectorAll('[data-exam-jump]').forEach(b=>b.onclick=()=>{ex.index=+b.dataset.examJump;save();renderExam();window.scrollTo(0,0)});document.getElementById('examPrev').onclick=()=>{ex.index--;save();renderExam();window.scrollTo(0,0)};document.getElementById('examNext').onclick=()=>{ex.index++;save();renderExam();window.scrollTo(0,0)};document.getElementById('examFinish').onclick=()=>{let missing=ex.items.length-Object.keys(ex.answers).length;if(confirm(`Prüfung jetzt abgeben? ${missing?missing+' Fragen sind noch unbeantwortet.':'Alle Fragen sind beantwortet.'}`)){finishExam();renderExamResult(0)}};startExamTimer()}
function renderExamResult(index){let d=examData(),h=d.history[index];if(!h){renderExam();return}tab='exam';stopExamTimer();updateStats();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));view.innerHTML=`<section class="panel"><h2>📊 Prüfungsauswertung</h2><p><strong>${examLabel(h.mode)}</strong> · ${new Date(h.finishedAt).toLocaleString('de-DE')}</p><h2>${h.correct} von ${h.total} richtig · ${h.percent} %</h2><p>${h.expired?'Die Zeit ist abgelaufen.':'Prüfung abgegeben.'} Unbeantwortete Fragen zählen als falsch.</p><button class="btn secondary" id="examBack">← Zur Prüfungsübersicht</button></section>`+h.items.map((q,i)=>`<section class="panel"><span class="chip">Modul ${q.moduleId}: ${esc(q.moduleTitle)}</span><h2>Frage ${i+1} ${h.answers[i]===q.a?'✓':'✗'}</h2><p>${esc(q.q)}</p><p><strong>Deine Antwort:</strong> ${h.answers[i]===undefined?'Nicht beantwortet':esc(q.opts[h.answers[i]])}</p><p><strong>Richtig:</strong> ${esc(q.opts[q.a])}</p><div class="feedback">${esc(q.why||'')}</div></section>`).join('');document.getElementById('examBack').onclick=()=>renderExam()}

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab!=='exam')stopExamTimer();render();window.scrollTo(0,0)});save();render();
</script><script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(err => console.warn("Offline-Funktion nicht verfügbar:", err))); }</script></body></html>
