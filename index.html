<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#18243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,.nav button:focus-visible{outline:3px solid #68b2ff;outline-offset:2px}.shell{max-width:800px;margin:auto;min-height:100vh;padding:20px 16px 100px}.hero{background:linear-gradient(130deg,#101b32,#25486f);color:#fff;border-radius:22px;padding:24px;margin-bottom:18px}.hero h1{font-size:1.6rem;margin:8px 0}.muted{color:#5f7089}.hero .muted{color:#bed1e8}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#294f72;color:#cceaff;font-size:.76rem;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{background:#ffffff15;border:1px solid #ffffff22;padding:12px 8px;border-radius:13px;text-align:center}.stat b{display:block;font-size:1.3rem}.stat small{font-size:.7rem;color:#d6e4f3}.bar{height:10px;background:#dfe6f0;border-radius:100px;overflow:hidden;margin:10px 0}.bar>div{height:100%;background:#2e91d1;width:0;transition:width .2s}.hero .bar{background:#ffffff33}.panel{background:#fff;border:1px solid #e1e8f0;border-radius:17px;padding:19px;margin-bottom:14px;box-shadow:0 2px 12px #20304c09}.panel h2{font-size:1.15rem;margin:0 0 12px}.panel h3{font-size:1rem;margin:18px 0 8px}.panel p{line-height:1.65}.btn{background:#166cb2;border:0;color:white;padding:12px 17px;border-radius:11px;font-weight:700}.btn.secondary{background:#e9f1fa;color:#164b7a}.btn.ghost{background:#fff;border:1px solid #d8e2ee;color:#1b4b76}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stack{display:grid;gap:10px}.lesson{border:1px solid #e0e8f2;border-radius:13px;padding:15px}.lesson h3{margin:0 0 6px}.lesson p{margin:6px 0}.chip{font-size:.72rem;border-radius:99px;padding:5px 9px;background:#e9f2ff;color:#205c9b;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:white;border-top:1px solid #dce5f0;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));z-index:5}.nav-inner{display:flex;width:100%;max-width:800px}.nav button{flex:1;border:0;background:transparent;padding:8px 2px;color:#65758a;font-size:.75rem;font-weight:650}.nav button.active{color:#1169b4;background:#eaf4ff;border-radius:10px}.option{display:block;width:100%;text-align:left;padding:13px;border:1px solid #dbe4ef;background:white;border-radius:11px;margin:7px 0;color:#1a2a40}.option.selected{border-color:#176eb8;background:#eaf4ff}.option.correct{border-color:#24865f;background:#e9f8f0}.option.wrong{border-color:#d05c5c;background:#fff0f0}.feedback{padding:12px;border-radius:10px;background:#f0f5fb;line-height:1.55;margin-top:10px}.flash{min-height:220px;display:grid;place-items:center;text-align:center;border:2px solid #bcd4eb;border-radius:16px;background:#eff7ff;padding:25px;cursor:pointer}.flash b{font-size:1.35rem}.flash small{display:block;margin-top:18px;color:#54708d}.checkline{display:flex;align-items:center;gap:10px;margin:12px 0;line-height:1.5}.checkline input{width:19px;height:19px;accent-color:#176eb8}table{width:100%;border-collapse:collapse;font-size:.93rem}th,td{padding:10px 7px;text-align:left;border-bottom:1px solid #e2e8f0}th{background:#f1f5fa}details{border:1px solid #e0e8f2;border-radius:12px;padding:12px;margin:8px 0}summary{font-weight:700;cursor:pointer}.note{border-left:4px solid #2987bd;padding:11px;background:#f0f7fc;border-radius:6px}.small{font-size:.85rem}.hidden{display:none!important}a{color:#176eb8}footer{color:#65758a;font-size:.75rem;text-align:center;padding:10px}
</style></head><body><main class="shell"><header class="hero"><span class="pill">DEINE PRIVATE LERNAPP · PROTOTYP</span><h1>🎓 IT-Prüfungscoach 2027</h1><p class="muted">IHK AP2 · Kaufmann/-frau für IT-System-Management</p><div class="bar"><div id="topbar"></div></div><div class="stats"><div class="stat"><b id="pct">0 %</b><small>Modulfortschritt</small></div><div class="stat"><b id="statLessons">0/5</b><small>Lektionen</small></div><div class="stat"><b id="statQuiz">–</b><small>Quiz-Bestwert</small></div></div></header><div id="view"></div><footer>Selbst erstellte Lerninhalte, keine offiziellen IHK-Prüfungsaufgaben. Lernstand bleibt in diesem Browser gespeichert.</footer></main><nav class="nav" aria-label="Navigation"><div class="nav-inner"><button data-tab="home" class="active">⌂<br>Start</button><button data-tab="lessons">▤<br>Lernen</button><button data-tab="quiz">✓<br>Quiz</button><button data-tab="cards">▣<br>Karten</button><button data-tab="progress">◴<br>Fortschritt</button></div></nav>
<script>
'use strict';
const lessons=[
{title:'Was ist ein IT-System?',minutes:12,html:`<p>Ein <strong>IT-System</strong> besteht aus zusammenwirkenden Komponenten: Hardware, Software, Netzwerk, Daten und IT-Dienstleistungen. Gemeinsam erfüllen sie eine geschäftliche Aufgabe.</p><p><strong>Praxisfall:</strong> Eine Kanzlei möchte zehn Arbeitsplätze modernisieren. Dazu gehören nicht nur PCs, sondern auch Betriebssysteme, gemeinsame Dokumentenablage, Netzwerkanbindung, Zugriffsschutz und Support.</p><table><tr><th>Bestandteil</th><th>Beispiel</th></tr><tr><td>Hardware</td><td>PC, Drucker, Switch</td></tr><tr><td>Software</td><td>Windows, Buchhaltungsprogramm</td></tr><tr><td>Netzwerk</td><td>LAN, WLAN</td></tr><tr><td>Daten</td><td>Rechnungen, Dokumente</td></tr><tr><td>IT-Service</td><td>Installation, Wartung</td></tr></table><p class="note"><strong>Merke:</strong> Ein IT-System ist mehr als ein einzelner Computer.</p>`},
{title:'Hardware und Software',minutes:12,html:`<p><strong>Hardware</strong> sind die physischen Komponenten eines Computers oder Netzwerks, z. B. CPU, Arbeitsspeicher (RAM), SSD, Switch und Router.</p><p><strong>Systemsoftware</strong> stellt grundlegende Funktionen bereit, z. B. Windows oder Linux. <strong>Anwendungssoftware</strong> unterstützt konkrete Aufgaben, z. B. Tabellenkalkulation oder Buchhaltung.</p><table><tr><th>Begriff</th><th>Funktion</th></tr><tr><td>CPU</td><td>Verarbeitet Befehle</td></tr><tr><td>RAM</td><td>Temporärer Arbeitsspeicher</td></tr><tr><td>SSD</td><td>Dauerhafter Datenspeicher</td></tr><tr><td>Switch</td><td>Verbindet Geräte in einem LAN</td></tr><tr><td>Router</td><td>Verbindet verschiedene IP-Netze</td></tr></table><p class="note">Eine SSD ist Hardware. Die darauf installierte Buchhaltungssoftware ist Anwendungssoftware.</p>`},
{title:'Kundenbedarf ermitteln',minutes:15,html:`<p>Ein Kunde sagt: „Unsere Rechner sind zu langsam. Wir brauchen zehn neue PCs.“ Ein guter IT-Kaufmann bestellt nicht sofort, sondern klärt zunächst die Ursache und das Ziel.</p><ol><li><strong>Ist-Situation:</strong> Welche Geräte und Systeme werden genutzt?</li><li><strong>Problem:</strong> Was ist langsam und wann?</li><li><strong>Soll-Situation:</strong> Was muss künftig besser funktionieren?</li><li><strong>Rahmenbedingungen:</strong> Budget, Zeit, Sicherheit, Kompatibilität?</li><li><strong>Lösung:</strong> Alternativen vergleichen und begründen.</li></ol><p><strong>Beispielfragen:</strong> Wie viele Mitarbeiter arbeiten gleichzeitig? Welche Software ist betroffen? Wann treten die Verzögerungen auf? Gibt es einen maximalen Kostenrahmen?</p><p class="note">Ziel ist eine bedarfsgerechte Lösung – nicht automatisch der Verkauf der teuersten Hardware.</p>`},
{title:'Anforderungen unterscheiden',minutes:13,html:`<p><strong>Funktionale Anforderungen</strong> beschreiben, <em>was</em> das System leisten soll: Dokumente speichern, Rechnungen als PDF erzeugen, Benutzerrechte vergeben.</p><p><strong>Nichtfunktionale Anforderungen</strong> beschreiben Qualitätsmerkmale oder Bedingungen: Verfügbarkeit, Reaktionszeit, Sicherheit, Bedienbarkeit.</p><p><strong>Projektvorgaben</strong> wie Budget und Einführungstermin werden oft separat dokumentiert. Je nach Unterrichtsmodell können sie auch unter Rahmenbedingungen oder nichtfunktionalen Anforderungen eingeordnet werden.</p><table><tr><th>Aussage</th><th>Einordnung</th></tr><tr><td>PDF-Rechnungen erzeugen</td><td>Funktional</td></tr><tr><td>99,9 % Verfügbarkeit</td><td>Nichtfunktional</td></tr><tr><td>Maximal 8.000 €</td><td>Budgetvorgabe</td></tr><tr><td>Einführung in vier Wochen</td><td>Terminvorgabe</td></tr></table>`},
{title:'Lastenheft und Pflichtenheft',minutes:15,html:`<p><strong>Lastenheft:</strong> Der Auftraggeber beschreibt Anforderungen, Ziele und Rahmenbedingungen: <em>Was wird benötigt und wozu?</em></p><p><strong>Pflichtenheft:</strong> Der Auftragnehmer konkretisiert die Umsetzung: <em>Wie werden die Anforderungen erfüllt?</em></p><p><strong>Praxisfall:</strong> Ein Unternehmen benötigt einen sicheren gemeinsamen Dokumentenzugriff (Lastenheft). Der Anbieter plant eine zentrale Ablage mit Rollenberechtigungen, Datensicherung und Abnahmetests (Pflichtenheft).</p><p class="note"><strong>Merksatz:</strong> Lastenheft = WAS? Pflichtenheft = WIE?</p><p>In echten Projekten können agile Backlogs oder andere Dokumentationsformen diese Aufgaben übernehmen.</p>`}
];
const questions=[
{q:'Welche Komponente ist Hardware?',opts:['Windows 11','Ein Netzwerk-Switch','Microsoft Excel','Ein SaaS-Abonnement'],a:1,why:'Ein Switch ist ein physisches Gerät zur Vernetzung. Die anderen Antworten bezeichnen Software oder einen Dienst.'},
{q:'Welche Aussage beschreibt Anwendungssoftware?',opts:['Sie verarbeitet konkrete Benutzeraufgaben.','Sie ist immer physisch eingebaut.','Sie ersetzt das gesamte Netzwerk.','Sie ist identisch mit Arbeitsspeicher.'],a:0,why:'Anwendungssoftware unterstützt konkrete Tätigkeiten wie Buchhaltung oder Textverarbeitung.'},
{q:'Was ist bei einem Wunsch nach zehn neuen PCs der beste erste Schritt?',opts:['Geräte direkt bestellen','Den teuersten PC anbieten','Die tatsächlichen Anforderungen ermitteln','Einen Liefertermin ohne Rückfrage festlegen'],a:2,why:'Zuerst wird geklärt, welches Problem besteht und welche Lösung wirtschaftlich geeignet ist.'},
{q:'Welche Anforderung ist funktional?',opts:['99,9 % Verfügbarkeit','Rechnungen als PDF erzeugen','Einführung in vier Wochen','Maximal 8.000 € Projektbudget'],a:1,why:'Die Erstellung von PDF-Rechnungen ist eine konkrete Systemfunktion.'},
{q:'Was ist eine nichtfunktionale Anforderung?',opts:['Dokumente hochladen','Benutzerkonten anlegen','Kundendaten importieren','Antwortzeit unter zwei Sekunden'],a:3,why:'Die Antwortzeit ist ein messbares Qualitätsmerkmal.'},
{q:'Wer formuliert im klassischen Modell das Lastenheft?',opts:['Der Auftraggeber','Der Prozessorhersteller','Die IHK','Der Netzwerk-Switch'],a:0,why:'Der Auftraggeber beschreibt im Lastenheft seinen Bedarf.'},
{q:'Wozu dient das Pflichtenheft?',opts:['Zur Urlaubsplanung','Zur technischen und organisatorischen Umsetzung der Anforderungen','Zum Erfassen von Arbeitszeiten allein','Zum Ersetzen jeder Vertragsregelung'],a:1,why:'Das Pflichtenheft beschreibt, wie der Auftragnehmer die Anforderungen erfüllen will.'},
{q:'Welcher Speicher verliert bei Stromausfall normalerweise seinen Inhalt?',opts:['SSD','HDD','RAM','USB-Stick'],a:2,why:'RAM ist flüchtiger Arbeitsspeicher; SSD, HDD und USB-Sticks speichern Daten nichtflüchtig.'},
{q:'Was ist eine sinnvolle Frage zur Bedarfsermittlung?',opts:['Welche Lösung möchten wir am liebsten verkaufen?','Wie viele Personen greifen gleichzeitig auf die Daten zu?','Können wir auf die Anforderungen verzichten?','Ist eine Abnahme grundsätzlich unnötig?'],a:1,why:'Die Anzahl gleichzeitiger Benutzer beeinflusst Kapazitäts- und Lösungsplanung.'},
{q:'Wie ist „Einführung innerhalb von vier Wochen“ am präzisesten einzuordnen?',opts:['Als Funktion der Software','Als Hardwaremerkmal','Als Termin- bzw. Projektvorgabe','Als Betriebssystem'],a:2,why:'Der Zeitraum ist eine Vorgabe für das Projekt, keine Softwarefunktion.'}
];
const cards=[['IT-System','Zusammenspiel aus Hardware, Software, Netzwerk, Daten und Diensten.'],['Hardware','Physisch vorhandene Geräte und Komponenten.'],['Systemsoftware','Software für den grundlegenden Betrieb, z. B. Windows oder Linux.'],['Anwendungssoftware','Programme für konkrete Benutzeraufgaben, z. B. Buchhaltung.'],['CPU','Prozessor, der Befehle verarbeitet.'],['RAM','Flüchtiger Arbeitsspeicher.'],['SSD','Nichtflüchtiger Datenspeicher.'],['Switch','Verbindet Geräte innerhalb eines lokalen Netzwerks.'],['Bedarfsermittlung','Ist-Zustand, Probleme, Ziel, Rahmenbedingungen und Lösung klären.'],['Funktionale Anforderung','Beschreibt, was ein System können muss.'],['Nichtfunktionale Anforderung','Beschreibt Qualitätsmerkmale und Betriebsbedingungen.'],['Lastenheft','Anforderungen des Auftraggebers: WAS?'],['Pflichtenheft','Umsetzung durch den Auftragnehmer: WIE?'],['Budgetvorgabe','Kostenrahmen, den das Projekt einhalten soll.'],['Abnahme','Prüfung, ob vereinbarte Anforderungen erfüllt sind.']];
const key='ihk-coach-2027-v1';let state={completed:[],best:null,attempts:0,cardKnown:[],quizAnswers:{},quizChecked:false,cardIndex:0,flipped:false};try{let saved=JSON.parse(localStorage.getItem(key)||'{}');state={...state,...saved}}catch(e){}let tab='home';const view=document.getElementById('view');function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function updateStats(){let n=state.completed.length;document.getElementById('pct').textContent=Math.round(n/5*100)+' %';document.getElementById('topbar').style.width=n/5*100+'%';document.getElementById('statLessons').textContent=n+'/5';document.getElementById('statQuiz').textContent=state.best===null?'–':state.best+'/10'}function render(){updateStats();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')home();if(tab==='lessons')renderLessons();if(tab==='quiz')renderQuiz();if(tab==='cards')renderCards();if(tab==='progress')renderProgress()}function home(){view.innerHTML=`<section class="panel"><h2>Willkommen in Modul 1 👋</h2><p>Starte bei den Grundlagen. Lies die fünf Lektionen, übe anschließend mit zehn Fragen und wiederhole die wichtigsten Begriffe mit 15 Karteikarten.</p><div class="row"><button class="btn" data-go="lessons">Jetzt lernen →</button><span class="chip">Einsteiger · ca. 70 Minuten</span></div></section><section class="panel"><h2>Dein Lernweg</h2><div class="stack"><div class="lesson"><b>1. 📘 Lektionen</b><p class="muted small">Fünf Erklärungen mit Praxisbeispielen und Merksätzen.</p></div><div class="lesson"><b>2. 🧠 Wissensquiz</b><p class="muted small">Zehn Fragen mit Bewertung und Erklärungen.</p></div><div class="lesson"><b>3. 🗂️ Karteikarten</b><p class="muted small">Begriffe wiederholen und als gelernt markieren.</p></div></div></section><section class="panel"><h2>Prüfungsvorbereitung 2027</h2><p class="muted small">Dieses ist der erste funktionsfähige Prototyp für Modul 1. Die weiteren elf Module können später nach demselben Prinzip ergänzt werden.</p></section>`;bindGo()}
function bindGo(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.go;render()}))}
function renderLessons(){view.innerHTML=`<section class="panel"><h2>📘 Modul 1 – Lernlektionen</h2><p class="muted">Arbeite die Lektionen nacheinander durch. Markiere jede als abgeschlossen, wenn du sie verstanden hast.</p></section>`+lessons.map((l,i)=>`<section class="panel"><div class="row"><h2>${i+1}. ${esc(l.title)}</h2><span class="chip">${l.minutes} Min.</span></div><details ${i===0&&!state.completed.includes(0)?'open':''}><summary>Inhalt ${state.completed.includes(i)?'· ✓ erledigt':''}</summary><div>${l.html}</div></details><label class="checkline"><input type="checkbox" data-lesson="${i}" ${state.completed.includes(i)?'checked':''}><span>Lektion verstanden und abgeschlossen</span></label></section>`).join('')+`<section class="panel"><div class="row"><span>Bereit für die Übung?</span><button class="btn" data-go="quiz">Zum Quiz →</button></div></section>`;document.querySelectorAll('[data-lesson]').forEach(el=>el.addEventListener('change',()=>{let i=Number(el.dataset.lesson);state.completed=el.checked?[...new Set([...state.completed,i])].sort():state.completed.filter(x=>x!==i);save();render()}));bindGo()}
function renderQuiz(){let answered=Object.keys(state.quizAnswers).length;view.innerHTML=`<section class="panel"><h2>🧠 Modul-1-Wissenstest</h2><p class="muted">10 selbst erstellte Fragen · eine richtige Antwort pro Frage · Auswertung am Ende</p><p><strong>${answered}/10 beantwortet</strong></p></section>`+questions.map((q,i)=>`<section class="panel"><h2>Frage ${i+1} von 10</h2><p><strong>${esc(q.q)}</strong></p>${q.opts.map((o,j)=>`<button class="option ${state.quizAnswers[i]===j?'selected':''} ${state.quizChecked&&j===q.a?'correct':''} ${state.quizChecked&&state.quizAnswers[i]===j&&j!==q.a?'wrong':''}" data-q="${i}" data-a="${j}" ${state.quizChecked?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}${state.quizChecked?`<div class="feedback"><strong>${state.quizAnswers[i]===q.a?'✓ Richtig':'✗ Nicht richtig'}</strong><br>${esc(q.why)}</div>`:''}</section>`).join('')+`<section class="panel"><div class="row"><button class="btn" id="grade" ${answered<10||state.quizChecked?'disabled':''}>Quiz auswerten</button><button class="btn secondary" id="resetQuiz">Neu beginnen</button></div>${state.quizChecked?`<h2 style="margin-top:20px">Dein Ergebnis: ${questions.filter((q,i)=>state.quizAnswers[i]===q.a).length}/10</h2><p>${questions.filter((q,i)=>state.quizAnswers[i]===q.a).length>=8?'Sehr gut! Du hast das Lernziel erreicht.':'Wiederhole die Erklärungen zu den falsch beantworteten Fragen.'}</p>`:''}</section>`;document.querySelectorAll('[data-q]').forEach(el=>el.addEventListener('click',()=>{state.quizAnswers[el.dataset.q]=Number(el.dataset.a);save();renderQuiz()}));document.getElementById('grade').addEventListener('click',()=>{let score=questions.filter((q,i)=>state.quizAnswers[i]===q.a).length;state.quizChecked=true;state.attempts++;state.best=Math.max(state.best??0,score);save();render()});document.getElementById('resetQuiz').addEventListener('click',()=>{state.quizAnswers={};state.quizChecked=false;save();renderQuiz()})}
function renderCards(){let i=state.cardIndex%cards.length;let c=cards[i];view.innerHTML=`<section class="panel"><h2>🗂️ Digitale Karteikarten</h2><p class="muted">Tippe auf die Karte, um die Antwort aufzudecken. Markiere Begriffe, die du sicher kannst.</p><div class="row"><span class="chip">Karte ${i+1} von ${cards.length}</span><span class="chip">${state.cardKnown.length} gelernt</span></div><div class="bar"><div style="width:${state.cardKnown.length/cards.length*100}%"></div></div></section><section class="panel"><div class="flash" id="flip" role="button" tabindex="0"><div><b>${esc(state.flipped?c[1]:c[0])}</b><small>${state.flipped?'Tippen: zurück zur Frage':'Tippen: Antwort anzeigen'}</small></div></div><div class="row" style="margin-top:16px"><button class="btn secondary" id="prev">← Zurück</button><button class="btn" id="next">Weiter →</button></div><label class="checkline"><input type="checkbox" id="known" ${state.cardKnown.includes(i)?'checked':''}><span>Diesen Begriff beherrsche ich</span></label></section>`;function move(d){state.cardIndex=(state.cardIndex+d+cards.length)%cards.length;state.flipped=false;save();renderCards()}let flip=()=>{state.flipped=!state.flipped;save();renderCards()};document.getElementById('flip').addEventListener('click',flip);document.getElementById('flip').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});document.getElementById('prev').addEventListener('click',()=>move(-1));document.getElementById('next').addEventListener('click',()=>move(1));document.getElementById('known').addEventListener('change',e=>{state.cardKnown=e.target.checked?[...new Set([...state.cardKnown,i])]:state.cardKnown.filter(x=>x!==i);save();renderCards()})}
function renderProgress(){view.innerHTML=`<section class="panel"><h2>📊 Dein Lernfortschritt</h2><p>Abgeschlossene Lektionen: <strong>${state.completed.length} von 5</strong></p><div class="bar"><div style="width:${state.completed.length/5*100}%"></div></div><p>Gelernte Karteikarten: <strong>${state.cardKnown.length} von ${cards.length}</strong></p><div class="bar"><div style="width:${state.cardKnown.length/cards.length*100}%"></div></div><p>Quizversuche: <strong>${state.attempts}</strong></p><p>Bester Quizwert: <strong>${state.best===null?'Noch kein Versuch':state.best+' von 10'}</strong></p></section><section class="panel"><h2>Dein Modulziel</h2><label class="checkline"><input type="checkbox" disabled ${state.completed.length===5?'checked':''}>Alle fünf Lektionen abschließen</label><label class="checkline"><input type="checkbox" disabled ${state.best!==null&&state.best>=8?'checked':''}>Mindestens 8 von 10 Quizfragen richtig</label><label class="checkline"><input type="checkbox" disabled ${state.cardKnown.length===cards.length?'checked':''}>Alle 15 Karteikarten beherrschen</label>${state.completed.length===5&&state.best>=8&&state.cardKnown.length===cards.length?'<p class="note">🎉 Modul 1 geschafft! Du kannst mit dem nächsten Modul weitermachen.</p>':''}</section><section class="panel"><h2>Datensicherung</h2><p class="muted small">Der Lernstand liegt ausschließlich im lokalen Speicher dieses Browsers. Du kannst ihn als JSON-Datei sichern und später auf demselben oder einem anderen Gerät wieder einlesen. Ohne Sicherung kann er beim Löschen von Browserdaten verloren gehen.</p><div class="row"><button class="btn secondary" id="export">Fortschritt exportieren</button><label class="btn ghost" style="cursor:pointer">Fortschritt importieren<input id="import" type="file" accept="application/json,.json" style="display:none"></label></div><p class="small muted" id="importMsg"></p></section>`;document.getElementById('export').addEventListener('click',()=>{let blob=new Blob([JSON.stringify({app:'ihk-coach-2027-v1',state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ihk-lernstand-2027.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});document.getElementById('import').addEventListener('change',async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.app!=='ihk-coach-2027-v1'||!data.state||!Array.isArray(data.state.completed)||!Array.isArray(data.state.cardKnown))throw Error('Ungültige Sicherung');state={...state,...data.state};state.completed=state.completed.filter(x=>Number.isInteger(x)&&x>=0&&x<5);state.cardKnown=state.cardKnown.filter(x=>Number.isInteger(x)&&x>=0&&x<cards.length);save();render()}catch(err){document.getElementById('importMsg').textContent='Import fehlgeschlagen: '+err.message}})}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)}));render();
</script><script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(err => console.warn("Offline-Funktion nicht verfügbar:", err))); }</script></body></html>
